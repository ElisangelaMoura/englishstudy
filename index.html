<script>
        // Configuração do Firebase com base no seu projeto
        const firebaseConfig = {
            apiKey: "AIzaSyCfutWIEHVKWGBi0p5DipuI7BXJ0kRHG-g",
            authDomain: "english-flashcards-system.firebaseapp.com",
            databaseURL: "https://english-flashcards-system-default-rtdb.firebaseio.com",
            projectId: "english-flashcards-system",
            storageBucket: "english-flashcards-system.appspot.com",
            messagingSenderId: "1029742136135",
            appId: "1:1029742136135:web:f47b0b946a5b8a5bb1da62"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let decks = {
            movies: [],
            nextWeek: [],
            nextMonth: [],
            timeToTime: []
        };

        let currentDeckKey = null;
        let isReviewDeck = false;
        let currentIndex = 0;
        let showingBack = false;
        let editingIndex = null;
        let isSyncingFromCloud = false;

        const card = document.getElementById("card");
        const cardTag = document.getElementById("cardTag");
        const cardContent = document.getElementById("cardContent");
        const imageContainer = document.getElementById("imageContainer");
        const cardCounter = document.getElementById("cardCounter");
        
        const newMovieNameInput = document.getElementById("newMovieNameInput");
        const newFrontInput = document.getElementById("newFront");
        const newBackInput = document.getElementById("newBack");
        const newExerciseInput = document.getElementById("newExercise");
        const optAInput = document.getElementById("optA");
        const optBInput = document.getElementById("optB");
        const optCInput = document.getElementById("optC");
        const optDInput = document.getElementById("optD");
        const correctOptionSelect = document.getElementById("correctOption");
        const newImageInput = document.getElementById("newImage");
        const cardMovieSelect = document.getElementById("cardMovieSelect");
        const formTitle = document.getElementById("formTitle");
        const saveBtn = document.getElementById("saveBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const movieDecksContainer = document.getElementById("movieDecksContainer");
        const manualModal = document.getElementById("manualModal");

        function openManual() {
            manualModal.style.display = "flex";
        }

        function closeManual() {
            manualModal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target === manualModal) {
                closeManual();
            }
        }

        // Sincronização Automática com o Firebase em Tempo Real
        function saveToCloud() {
            if (isSyncingFromCloud) return;
            db.ref('flashcards_data').set(decks).catch(err => {
                console.error("Erro ao salvar na nuvem:", err);
            });
        }

        db.ref('flashcards_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                isSyncingFromCloud = true;
                
                // Garante que cada filme tenha a propriedade 'cards' inicializada como array
                let loadedMovies = data.movies || [];
                loadedMovies = loadedMovies.map(movie => ({
                    ...movie,
                    cards: Array.isArray(movie.cards) ? movie.cards : []
                }));

                decks = {
                    movies: loadedMovies,
                    nextWeek: Array.isArray(data.nextWeek) ? data.nextWeek : [],
                    nextMonth: Array.isArray(data.nextMonth) ? data.nextMonth : [],
                    timeToTime: Array.isArray(data.timeToTime) ? data.timeToTime : []
                };

                if (!currentDeckKey && decks.movies.length > 0) {
                    currentDeckKey = decks.movies[0].id;
                    isReviewDeck = false;
                } else if (!isReviewDeck && currentDeckKey && !decks.movies.some(m => m.id === currentDeckKey)) {
                    if (decks.movies.length > 0) {
                        currentDeckKey = decks.movies[0].id;
                    } else {
                        currentDeckKey = null;
                    }
                }

                renderMenus();
                updateView();
                isSyncingFromCloud = false;
            }
        });

        function addNewMovie() {
            const movieName = newMovieNameInput.value.trim();
            if (movieName === "") {
                alert("Please enter the theme name!");
                return;
            }

            let movieId = movieName.toLowerCase().replace(/[^a-z0-9]/g, '-');
            
            if (decks.movies.some(m => m.id === movieId)) {
                movieId += '-' + Math.floor(Math.random() * 1000);
            }

            decks.movies.push({
                id: movieId,
                name: movieName,
                cards: []
            });

            newMovieNameInput.value = "";
            saveToCloud();
            renderMenus();
            switchMovieDeck(movieId);
        }

        function renderMenus() {
            movieDecksContainer.innerHTML = "";
            cardMovieSelect.innerHTML = "";

            if (decks.movies.length === 0) {
                cardMovieSelect.innerHTML = `<option value="">No theme registered</option>`;
            } else {
                decks.movies.forEach(movie => {
                    const opt = document.createElement("option");
                    opt.value = movie.id;
                    opt.innerText = movie.name;
                    cardMovieSelect.appendChild(opt);
                });
            }

            decks.movies.forEach(movie => {
                const btn = document.createElement("button");
                btn.id = `tab-${movie.id}`;
                btn.innerText = `📁 ${movie.name}`;
                btn.onclick = () => switchMovieDeck(movie.id);
                if (!isReviewDeck && currentDeckKey === movie.id) {
                    btn.classList.add("active");
                }
                movieDecksContainer.appendChild(btn);
            });

            ['nextWeek', 'nextMonth', 'timeToTime'].forEach(key => {
                const tabBtn = document.getElementById('tab-' + key);
                if (tabBtn) {
                    if (isReviewDeck && currentDeckKey === key) {
                        tabBtn.classList.add("active");
                    } else {
                        tabBtn.classList.remove("active");
                    }
                }
            });

            // Mantém o select do formulário sincronizado com o deck atual se for um tema de filme
            if (!isReviewDeck && currentDeckKey) {
                cardMovieSelect.value = currentDeckKey;
            }
        }

        function switchMovieDeck(movieId) {
            isReviewDeck = false;
            currentDeckKey = movieId;
            currentIndex = 0;
            showingBack = false;
            cancelEdit();
            renderMenus();
            updateView();
        }

        function switchDeck(deckKey) {
            isReviewDeck = true;
            currentDeckKey = deckKey;
            currentIndex = 0;
            showingBack = false;
            cancelEdit();
            renderMenus();
            updateView();
        }

        function getActiveCardsList() {
            if (isReviewDeck) {
                return currentDeckKey ? decks[currentDeckKey] : [];
            } else {
                const movie = decks.movies.find(m => m.id === currentDeckKey);
                return movie ? movie.cards : [];
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateView() {
            let activeList = getActiveCardsList();
            card.classList.remove("show-back");
            showingBack = false;

            if (!currentDeckKey || activeList.length === 0) {
                cardTag.innerText = "Empty Deck";
                cardContent.innerHTML = "<span class='empty-state'>Register a theme and add flashcards to begin!</span>";
                imageContainer.innerHTML = "";
                cardCounter.innerText = "Card 0 of 0";
                return;
            }

            if (currentIndex >= activeList.length) {
                currentIndex = 0;
            }

            const currentCard = activeList[currentIndex];
            cardTag.innerText = "Front (Question)";
            cardContent.innerHTML = `<div style="font-size: 20px; margin-bottom: 3px;">${currentCard.front}</div>`;
            
            if (currentCard.image && currentCard.image.trim() !== "") {
                imageContainer.innerHTML = `<img src="${currentCard.image}" class="card-image" alt="Card Image">`;
            } else {
                imageContainer.innerHTML = "";
            }

            let deckNameLabel = currentDeckKey.toUpperCase();
            if (!isReviewDeck) {
                const mov = decks.movies.find(m => m.id === currentDeckKey);
                deckNameLabel = mov ? mov.name : "THEME";
            }

            cardCounter.innerText = `Card ${currentIndex + 1} of ${activeList.length} (${deckNameLabel})`;
            speakText(currentCard.front);
        }

        function toggleCard() {
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;

            const currentCard = activeList[currentIndex];

            if (!showingBack) {
                card.classList.add("show-back");
                cardTag.innerText = "Back (Answer & Exercise)";
                
                let exerciseHTML = "";
                if (currentCard.exercise && currentCard.exercise.trim() !== "") {
                    let optionsButtons = "";
                    if (currentCard.options && currentCard.options.filter(o => o.trim() !== "").length > 0) {
                        optionsButtons = currentCard.options.map((optText, index) => {
                            if (!optText || optText.trim() === "") return "";
                            let letter = ['A', 'B', 'C', 'D'][index];
                            return `<button class="option-btn" onclick="checkMultipleChoice(event, ${index}, ${currentCard.correct})">${letter}) ${optText}</button>`;
                        }).join('');
                    }

                    if (optionsButtons !== "") {
                        optionsButtons = `
                            <div class="exercise-title" style="margin-top:6px;">Practice in Context:</div>
                            <div class="options-container" id="optionsGroup">
                                ${optionsButtons}
                            </div>
                            <div id="answerFeedback" class="feedback-msg"></div>
                        `;
                    }

                    exerciseHTML = `
                        <div class="exercise-box">
                            <div style="margin-bottom: 4px;">${currentCard.exercise}</div>
                            ${optionsButtons}
                        </div>
                    `;
                }

                cardContent.innerHTML = `
                    <div class="back-content">
                        <div class="explanation"><strong>Meaning:</strong> ${currentCard.back}</div>
                        ${exerciseHTML}
                    </div>
                `;
                
                if (currentCard.image && currentCard.image.trim() !== "") {
                    imageContainer.innerHTML = `<img src="${currentCard.image}" class="card-image" alt="Card Image">`;
                } else {
                    imageContainer.innerHTML = "";
                }

                showingBack = true;
                speakText(currentCard.back);
            } else {
                card.classList.remove("show-back");
                cardTag.innerText = "Front (Question)";
                cardContent.innerHTML = `<div style="font-size: 20px; margin-bottom: 3px;">${currentCard.front}</div>`;
                
                if (currentCard.image && currentCard.image.trim() !== "") {
                    imageContainer.innerHTML = `<img src="${currentCard.image}" class="card-image" alt="Card Image">`;
                } else {
                    imageContainer.innerHTML = "";
                }

                showingBack = false;
                speakText(currentCard.front);
            }
        }

        function checkMultipleChoice(event, selectedIndex, correctIndex) {
            event.stopPropagation();
            const group = document.getElementById("optionsGroup");
            const buttons = group.getElementsByClassName("option-btn");
            const feedback = document.getElementById("answerFeedback");
            const letters = ['A', 'B', 'C', 'D'];

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.add("correct");
                feedback.style.color = "#34d399";
                feedback.innerText = "🎉 Correct Answer!";
            } else {
                buttons[selectedIndex].classList.add("wrong");
                if (buttons[correctIndex]) {
                    buttons[correctIndex].classList.add("correct");
                }
                feedback.style.color = "#fca5a5";
                feedback.innerText = `❌ Incorrect. The correct answer was letter ${letters[correctIndex]}.`;
            }
        }

        function speakCurrent(event) {
            event.stopPropagation();
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;
            let textToSpeak = showingBack ? activeList[currentIndex].back : activeList[currentIndex].front;
            speakText(textToSpeak);
        }

        function nextCard(event) {
            event.stopPropagation();
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;
            currentIndex = (currentIndex + 1) % activeList.length;
            updateView();
        }

        function prevCard(event) {
            event.stopPropagation();
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;
            currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
            updateView();
        }

        function moveToDeck(targetDeckKey) {
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;

            let cardToMove = activeList.splice(currentIndex, 1)[0];
            decks[targetDeckKey].push(cardToMove);

            if (currentIndex >= activeList.length && currentIndex > 0) {
                currentIndex--;
            }

            saveToCloud();
            updateView();
        }

        function loadCardForEditing() {
            let activeList = getActiveCardsList();
            if (activeList.length === 0) return;

            const currentCard = activeList[currentIndex];
            newFrontInput.value = currentCard.front;
            newBackInput.value = currentCard.back;
            newExerciseInput.value = currentCard.exercise || "";
            
            if (currentCard.options && currentCard.options.length === 4) {
                optAInput.value = currentCard.options[0] || "";
                optBInput.value = currentCard.options[1] || "";
                optCInput.value = currentCard.options[2] || "";
                optDInput.value = currentCard.options[3] || "";
                correctOptionSelect.value = currentCard.correct;
            } else {
                optAInput.value = "";
                optBInput.value = "";
                optCInput.value = "";
                optDInput.value = "";
                correctOptionSelect.value = "0";
            }

            newImageInput.value = currentCard.image || "";

            if (!isReviewDeck) {
                cardMovieSelect.value = currentDeckKey;
            }

            editingIndex = currentIndex;
            formTitle.innerText = "✏️ Editing Card";
            saveBtn.innerText = "Update";
            saveBtn.classList.add("edit-mode");
            cancelEditBtn.style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingIndex = null;
            newFrontInput.value = "";
            newBackInput.value = "";
            newExerciseInput.value = "";
            optAInput.value = "";
            optBInput.value = "";
            optCInput.value = "";
            optDInput.value = "";
            correctOptionSelect.value = "0";
            newImageInput.value = "";
            formTitle.innerText = "🛠️ Flashcard Management";
            saveBtn.innerText = "Save Card";
            saveBtn.classList.remove("edit-mode");
            cancelEditBtn.style.display = "none";
        }

        function saveCard() {
            const frontVal = newFrontInput.value.trim();
            const backVal = newBackInput.value.trim();
            const exerciseVal = newExerciseInput.value.trim();
            
            const optionsArr = [
                optAInput.value.trim(),
                optBInput.value.trim(),
                optCInput.value.trim(),
                optDInput.value.trim()
            ];
            const correctVal = parseInt(correctOptionSelect.value);
            const imageVal = newImageInput.value.trim();
            
            // Se o usuário estiver visualizando um deck de filme, prioriza o deck atual da tela
            let selectedMovieId = selectedMovieId = (!isReviewDeck && currentDeckKey) ? currentDeckKey : cardMovieSelect.value;

            if (frontVal === "" || backVal === "") {
                alert("Please fill in at least the Front and Back Explanation!");
                return;
            }

            if (!selectedMovieId && editingIndex === null) {
                alert("Please select or create a theme before saving the card!");
                return;
            }

            let cardData = { 
                front: frontVal, 
                back: backVal, 
                exercise: exerciseVal, 
                options: optionsArr,
                correct: correctVal,
                image: imageVal 
            };

            if (editingIndex !== null) {
                let activeList = getActiveCardsList();
                activeList[editingIndex] = cardData;
                cancelEdit();
                saveToCloud();
                updateView();
            } else {
                const movie = decks.movies.find(m => m.id === selectedMovieId);
                if (movie) {
                    if (!Array.isArray(movie.cards)) {
                        movie.cards = [];
                    }
                    movie.cards.push(cardData);
                    switchMovieDeck(selectedMovieId);
                    currentIndex = movie.cards.length - 1;
                    saveToCloud();
                    updateView();
                    cancelEdit();
                }
            }
        }
    </script>
